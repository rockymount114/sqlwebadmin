[package]
name = "sqlwebadmin"
version = "0.1.0"
edition = "2021"
authors = ["SQL Web Admin Rust Port"]
description = "High-performance web admin for SQL databases in Rust"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
csv = "1.3"
tiberius = { version = "0.12", default-features = false, features = ["chrono", "tds73", "tokio-rustls"] }
tokio-util = { version = "0.7", features = ["compat"] }
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "postgres", "mysql", "sqlite", "chrono", "json"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
roxmltree = "0.19"
toml = "0.8"
